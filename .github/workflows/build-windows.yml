name: Build 444CFG TOOL Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Buscar proyecto
        shell: pwsh
        run: |
          $project = Get-ChildItem -Recurse -Filter package.json -File |
            Where-Object {
              Test-Path (Join-Path $_.DirectoryName "src-tauri/Cargo.toml")
            } |
            Select-Object -First 1

          if (-not $project) {
            throw "No se encuentra 444CFG TOOL"
          }

          "PROJECT_DIR=$($project.DirectoryName)" >> $env:GITHUB_ENV

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Configurar licencia
        working-directory: ${{ env.PROJECT_DIR }}
        shell: pwsh
        env:
          CFG444_PUBLIC_KEY_HEX: ${{ secrets.CFG444_PUBLIC_KEY_HEX }}
        run: |
          $key = "$env:CFG444_PUBLIC_KEY_HEX".Trim()

          if ($key -notmatch '^[0-9a-fA-F]{64}$') {
            throw "Falta configurar la clave publica"
          }

          Set-Content src-tauri/public.key $key -NoNewline

      - name: Comprobar TypeScript
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run typecheck

      - name: Comprobar licencias
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run test:keys

      - name: Comprobar Rust
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Crear EXE
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx tauri build

      - name: Descargar instalador
        uses: actions/upload-artifact@v4
        with:
          name: 444CFG-TOOL-INSTALLER
          path: ${{ env.PROJECT_DIR }}/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Descargar EXE portable
        uses: actions/upload-artifact@v4
        with:
          name: 444CFG-TOOL-EXE
          path: ${{ env.PROJECT_DIR }}/src-tauri/target/release/cfg444-tool.exe
          if-no-files-found: error
